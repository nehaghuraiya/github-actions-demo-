name: First CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Print Message
        run: echo "Pipeline triggered successfully"

      - name: Show Files
        run: ls -la

      - name: Read File
        run: cat app.txt
