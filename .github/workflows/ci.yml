name: CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify File Exists
        run: |
          ls -la
          cat app.txt

      - name: Run Validation
        run: |
          echo "Running validation checks"
          grep "Hello" app.txt
